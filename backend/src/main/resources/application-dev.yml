spring:
  datasource:
    url: jdbc:mysql://localhost:3307/nexustasks_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate # On utilisera Flyway plus tard, donc on désactive la génération auto
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true # Utile si la base existe déjà mais n'a pas l'historique Flyway
    locations: classpath:db/migration
    validate-on-migrate: true
  mail:
    host: localhost
    port: 1025

logging:
  level:
    com.nexustasks: DEBUG
    org.springframework.security: DEBUG