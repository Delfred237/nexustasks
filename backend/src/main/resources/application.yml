spring:
  application:
    name: NexusTasks
  profiles:
    active: dev # Profil par défaut si aucun n'est spécifié
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  mvc:
    problem-details:
      enabled: true  # Active le support natif Problem Details
  jackson:
    serialization:
      write-dates-as-timestamps: false  # ISO 8601 pour les dates
    default-property-inclusion: non_null

app:
  mail:
    from: ${MAIL_FROM:noreply@nexustasks.com}
    from-name: ${MAIL_FROM_NAME:NexusTasks}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  storage:
    local:
      base-path: ${STORAGE_PATH:./storage}
    max-file-size: ${MAX_FILE_SIZE:3MB}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F428472B4B62503545357565B5258} # 512-bit key for HS512 (Dev default, MUST override in Prod)
  access-token-expiration: 900000 # 15 minutes
  refresh-token-expiration: 604800000 # 7 days

security:
  otp:
    ttl-minutes: 15
    max-attempts: 5
    resend-cooldown-seconds: 60

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never # Sécurité : ne jamais exposer les stack traces
    include-path: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# CORS Configuration (externalisée)
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none
    # Désactivaction le "Try it out" par défaut pour éviter les accidents
    try-it-out-enabled: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  # Ne pas scanner les endpoints actuator
  paths-to-exclude: /actuator/**