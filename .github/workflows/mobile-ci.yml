name: Mobile CI

on:
    push:
        branches: [main]
        paths:
            - "mobile/**"
            - ".github/workflows/mobile-ci.yml"
    pull_request:
        branches: [main]
        paths:
            - "mobile/**"
            - ".github/workflows/mobile-ci.yml"

concurrency:
    group: mobile-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze-test:
        name: Analyze & Test (Flutter 3.47)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mobile

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.47.x"
                  channel: stable
                  cache: true

            - name: Pub get
              run: flutter pub get

            - name: Static analysis
              run: flutter analyze

            - name: Unit & widget tests
              run: flutter test

    build-apk:
        name: Build release APK (artifact)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: analyze-test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mobile

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.47.x"
                  channel: stable
                  cache: true

            - name: Pub get
              run: flutter pub get

            - name: Build release APK
              run: flutter build apk --release

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: app-release-apk
                  path: mobile/build/app/outputs/flutter-apk/app-release.apk
                  retention-days: 14
