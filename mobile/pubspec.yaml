name: nexustasks_mobile
description: NexusTasks mobile app for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  
  # Routing
  go_router: ^17.2.3
  
  # HTTP Client
  dio: ^5.9.2

  
  # Media
  image_picker: ^1.1.2
  
  # Storage
  flutter_secure_storage: ^10.2.0
  
  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  
  # Logging
  talker_flutter: ^5.1.17
  
  # Forms
  reactive_forms: ^18.2.2
  
  # Utilities
  intl: ^0.20.3
  cached_network_image: ^3.4.1

  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  
  # Code Generation
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^3.0.0
  
  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#4F46E5"
  android_12:
    color: "#4F46E5"